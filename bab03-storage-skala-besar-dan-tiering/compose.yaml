# Lab Bab 3: storage skala besar dan tiering (P03). RustFS sendiri; opsional membaca bronze platform.
name: de-bab03

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  rustfs:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?isi S3_ACCESS_KEY di .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?isi S3_SECRET_KEY di .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes:
      - rustfs:/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:52303:9000"
      - "${BIND_ADDR:-127.0.0.1}:52304:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9000/health || nc -z 127.0.0.1 9000"]
      interval: 3s
      timeout: 3s
      retries: 40

  api:
    build: ./api
    image: de-bab03-api:1.0
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-lab3}
      BARIS_HARIAN: ${BARIS_HARIAN:-20000}
      PLATFORM_S3_ENDPOINT: ${PLATFORM_S3_ENDPOINT:-}
      PLATFORM_S3_ACCESS_KEY: ${PLATFORM_S3_ACCESS_KEY:-}
      PLATFORM_S3_SECRET_KEY: ${PLATFORM_S3_SECRET_KEY:-}
      PLATFORM_S3_BUCKET: ${PLATFORM_S3_BUCKET:-lake}
    depends_on:
      rustfs: { condition: service_healthy }
    ports: ["${BIND_ADDR:-127.0.0.1}:52301:8080"]

  ui:
    build: ./ui
    image: de-bab03-ui:1.0
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    environment:
      API_URL: http://api:8080
    depends_on:
      api: { condition: service_healthy }
    ports: ["${BIND_ADDR:-127.0.0.1}:52300:3000"]

volumes:
  rustfs:
