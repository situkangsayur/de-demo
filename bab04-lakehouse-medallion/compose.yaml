# Lab Bab 4 (P04): lakehouse medallion dan Apache Iceberg di RustFS.
# Berjalan sendiri tanpa platform; bronze sintetis berskema platform dibangkitkan oleh api.
name: de-bab04

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  rustfs:
    image: rustfs/rustfs:1.0.4
    logging: *logging
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?isi S3_ACCESS_KEY di .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?isi S3_SECRET_KEY di .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes: ["rustfs:/data"]
    mem_limit: 512m
    ports:
      - "${BIND_ADDR:-127.0.0.1}:52402:9000"
      - "${BIND_ADDR:-127.0.0.1}:52403:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9000/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 60

  api:
    image: de-bab04-api:1.0
    build: ./api
    logging: *logging
    environment:
      SERVICE_NAME: bab04-api
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-lake}
      ICEBERG_CATALOG_URI: sqlite:////data/katalog.db
      STATE_DIR: /data
      TOKEN_PEPPER: ${TOKEN_PEPPER:?isi TOKEN_PEPPER di .env}
      PLATFORM_S3_ENDPOINT: ${PLATFORM_S3_ENDPOINT:-}
      PLATFORM_S3_ACCESS_KEY: ${PLATFORM_S3_ACCESS_KEY:-}
      PLATFORM_S3_SECRET_KEY: ${PLATFORM_S3_SECRET_KEY:-}
      PLATFORM_S3_BUCKET: ${PLATFORM_S3_BUCKET:-lake}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["katalog:/data"]
    mem_limit: 1g
    ports:
      - "${BIND_ADDR:-127.0.0.1}:52401:8000"
    depends_on:
      rustfs: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/sehat')"]
      interval: 3s
      timeout: 3s
      retries: 60

  ui:
    image: de-bab04-ui:1.0
    build: ./ui
    logging: *logging
    environment:
      API_URL: http://api:8000
    mem_limit: 256m
    ports:
      - "${BIND_ADDR:-127.0.0.1}:52400:3000"
    depends_on:
      api: { condition: service_healthy }

volumes:
  rustfs:
  katalog:
