# Debezium Server: CDC database `orders` (Postgres Sister) -> NATS JetStream stream CDC.
# Subject akhir: cdc.orders.<tabel> (RegexRouter membuang nama schema "public").
# Password dibaca dari variabel lingkungan container (${DEBEZIUM_PASSWORD}), tidak ditulis di sini.

# --- sink: NATS JetStream
debezium.sink.type=nats-jetstream
debezium.sink.nats-jetstream.url=nats://nats:4222
# Stream CDC sudah dibuat oleh nats-init (batas ukuran dan umur ditetapkan di sana).
debezium.sink.nats-jetstream.create-stream=false
debezium.sink.nats-jetstream.stream-name=CDC
debezium.sink.nats-jetstream.subjects=cdc.>

# --- source: PostgreSQL logical decoding (pgoutput, bawaan Postgres 10+)
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=${DEBEZIUM_USER}
debezium.source.database.password=${DEBEZIUM_PASSWORD}
debezium.source.database.dbname=orders
debezium.source.topic.prefix=cdc.orders
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=dbz_orders
debezium.source.publication.name=dbz_orders
# Publication dibuat oleh service Sister (bank: dbz_bank, order: dbz_orders) sesudah migrasi;
# disabled = pakai yang sudah ada (role debezium bukan pemilik tabel, tidak boleh membuat/mengubahnya).
debezium.source.publication.autocreate.mode=disabled
debezium.source.table.include.list=public.orders,public.order_history
# snapshot awal (op=r) lalu streaming perubahan (op=c/u/d)
debezium.source.snapshot.mode=initial
debezium.source.decimal.handling.mode=string
debezium.source.time.precision.mode=connect
debezium.source.tombstones.on.delete=false
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000

# --- routing subject: cdc.orders.public.<tabel> -> cdc.orders.<tabel>
debezium.transforms=route
debezium.transforms.route.type=org.apache.kafka.connect.transforms.RegexRouter
debezium.transforms.route.regex=cdc\\.orders\\.public\\.(.*)
debezium.transforms.route.replacement=cdc.orders.$1

# --- format envelope JSON tanpa schema: {before, after, source, op, ts_ms, transaction}
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false

# --- log JSON satu baris
quarkus.log.console.json=true
quarkus.log.level=INFO
