# Pengganti sementara bagian ops (penulis A) untuk mengembangkan dan menguji bagian data sendirian:
# RustFS + bucket lake + bronze sintetis sesuai KONTRAK-DATA.md. TIDAK dipakai bila compose.ops.yaml ada.
# Pemakaian (dari folder platform/):
#   docker compose -p de-platform-b -f compose.data.yaml -f data/dev/compose.dev.yaml up -d
# Tanpa port host agar tidak bentrok dengan RustFS milik ops (52003/52004).

services:
  rustfs:
    image: rustfs/rustfs:1.0.4
    mem_limit: 512m
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
    volumes:
      - data_rustfs_dev:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 3s
      timeout: 3s
      retries: 40

  bronze-dev:                    # membuat bucket lake lalu menulis bronze sintetis (45 hari)
    image: de-platform-data:1.0
    entrypoint: ["/usr/bin/dumb-init", "--", "/opt/data/mulai.sh"]
    command: ["bronze-dev"]
    mem_limit: 1g
    restart: "no"
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-lake}
      BRONZE_HARI: ${BRONZE_HARI:-45}
      SERVICE_NAME: bronze-dev
    depends_on:
      rustfs: {condition: service_healthy}

  data-init:
    depends_on:
      bronze-dev: {condition: service_completed_successfully}

volumes:
  data_rustfs_dev:
