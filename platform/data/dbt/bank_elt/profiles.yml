bank_elt:
  target: lab
  outputs:
    lab:
      type: clickhouse
      host: "{{ env_var('CLICKHOUSE_HOST', 'clickhouse') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD') }}"
      schema: gold
      driver: http
      threads: 4
      connect_timeout: 10
      send_receive_timeout: 300
      custom_settings:
        join_use_nulls: 1
