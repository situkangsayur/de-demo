# Bagian ops platform (penulis A): aplikasi operasional Sister bab05 (toko daring + bank) di-include
# apa adanya, lalu ditambah jalur ingestion Data Engineering:
#   app -> NATS JetStream (stream BANK, SHOP)  dan  WAL Postgres -> Debezium Server -> NATS (stream CDC)
#   -> ingestor -> bronze Parquet di RustFS (s3://lake/bronze/...).
# Dapat dijalankan sendiri: docker compose -f compose.ops.yaml up -d   (dari folder platform/)
# Lihat ops/README-OPS.md dan KONTRAK-DATA.md.
name: de-platform

include:
  # Aplikasi Sister dipakai dengan nama service aslinya (postgres, nats, apisix, ...).
  # SISTER_DIR relatif terhadap folder platform/ (atau absolut).
  - path: ${SISTER_DIR:-../../sister-hpc-demo}/bab05-microservices-messaging/compose.yaml

x-ops-health: &health
  interval: 3s
  timeout: 3s
  retries: 60

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-s3env: &s3env
  S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?isi S3_ACCESS_KEY di .env (contoh di ops/.env.ops.example)}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?isi S3_SECRET_KEY di .env (contoh di ops/.env.ops.example)}
  S3_BUCKET: ${S3_BUCKET:-lake}

x-debezium: &debezium
  image: quay.io/debezium/server:3.6.3.Final
  restart: unless-stopped
  logging: *logging
  environment:
    DEBEZIUM_USER: ${DEBEZIUM_USER:-debezium}
    DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD:?isi DEBEZIUM_PASSWORD di .env}
    JAVA_OPTS: -Xms128m -Xmx384m
  mem_limit: 640m
  # Publication dbz_bank / dbz_orders dibuat service bank / order saat migrasi, jadi Debezium
  # menunggu keduanya sehat.
  depends_on:
    postgres: { condition: service_healthy }
    bank: { condition: service_healthy }
    order-1: { condition: service_healthy }
    nats-init: { condition: service_completed_successfully }
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/q/health/ready >/dev/null"]
    interval: 5s
    timeout: 3s
    retries: 60

services:
  # ---------------------------------------------------------------- object storage
  rustfs:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    logging: *logging
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?isi S3_ACCESS_KEY di .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?isi S3_SECRET_KEY di .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes: ["ops_rustfs:/data"]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:52003:9000"
      - "${BIND_ADDR:-127.0.0.1}:52004:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9000/health || exit 1"]
      <<: *health

  # Membuat bucket lake (idempoten), lalu selesai.
  rustfs-init:
    image: de-ops-ingestor:1.0
    build: ./ops/ingestor
    logging: *logging
    command: ["python", "-m", "ingestor.init_bucket"]
    environment: *s3env
    depends_on:
      rustfs: { condition: service_healthy }
    restart: "no"

  # ---------------------------------------------------------------- NATS: stream CDC
  # Stream BANK dan SHOP dibuat oleh service Sister; stream CDC dibuat di sini agar batasnya
  # (ukuran, umur) jelas sebelum Debezium mulai menerbitkan.
  nats-init:
    image: de-ops-go:1.0
    build: ./ops/go
    logging: *logging
    command: ["opsctl", "init-streams"]
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      nats: { condition: service_healthy }
    restart: "no"

  # ---------------------------------------------------------------- CDC: Debezium Server
  debezium-bank:
    <<: *debezium
    volumes:
      - ./ops/debezium/bank.properties:/debezium/config/application.properties:ro
      - ops_dbz_bank:/debezium/data

  debezium-orders:
    <<: *debezium
    volumes:
      - ./ops/debezium/orders.properties:/debezium/config/application.properties:ro
      - ops_dbz_orders:/debezium/data

  # ---------------------------------------------------------------- ingestor -> bronze
  ingestor:
    image: de-ops-ingestor:1.0
    build: ./ops/ingestor
    restart: unless-stopped
    logging: *logging
    command: ["python", "-m", "ingestor.main"]
    environment:
      <<: *s3env
      NATS_URL: nats://nats:4222
      CATALOG_URL: http://apisix:9080/api/catalog
      INGEST_FLUSH_SECONDS: ${INGEST_FLUSH_SECONDS:-10}
      INGEST_FLUSH_MAX: ${INGEST_FLUSH_MAX:-2000}
    depends_on:
      rustfs-init: { condition: service_completed_successfully }
      nats-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]
      <<: *health

  # ---------------------------------------------------------------- API generator + aliran
  ops-api:
    image: de-ops-go:1.0
    build: ./ops/go
    restart: unless-stopped
    logging: *logging
    command: ["opsctl", "serve"]
    environment:
      NATS_URL: nats://nats:4222
      GATEWAY_URL: http://apisix:9080
      APISIX_KEY: ${APISIX_KEY:-changeme-storefront-key}
      INGESTOR_URL: http://ingestor:8080
      NATS_MONITOR_URL: http://nats:8222
    depends_on:
      nats-init: { condition: service_completed_successfully }
    ports: ["${BIND_ADDR:-127.0.0.1}:52001:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      <<: *health

  # ---------------------------------------------------------------- UI "Aliran data"
  ops-ui:
    image: de-ops-ui:1.0
    build: ./ops/ui
    restart: unless-stopped
    logging: *logging
    environment:
      OPS_API_URL: http://ops-api:8080
    depends_on: [ops-api]
    ports: ["${BIND_ADDR:-127.0.0.1}:52000:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      <<: *health

volumes:
  ops_rustfs:
  ops_dbz_bank:
  ops_dbz_orders:
